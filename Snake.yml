name: Generate Snake Animation

on:
  schedule:
    # Runs at 12 AM UTC every day
    - cron: "0 0 * * *"
  
  workflow_dispatch:
  
  push:
    branches:
    - main

# THIS IS THE CRITICAL FIX: Grants the action permission to push the output branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Updated to v4 to fix the Node.js warning
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generates the snake game
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Updated to v4 and uses the granted write permission
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
